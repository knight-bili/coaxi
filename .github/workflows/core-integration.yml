name: Core integration

on:
  workflow_dispatch:
  push:
    branches: ['phase/**']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/core-integration.yml'

permissions:
  contents: read

concurrency:
  group: core-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Core ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check format and all target types
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets
      - name: Run default workspace tests
        run: cargo test --workspace
      - name: Verify Runtime catalog and atomic migration regressions
        run: |
          cargo test -p rovai-core --features extended-tests gemini_
          cargo test -p rovai-core --features extended-tests runtime_catalog_migrations_preserve_rows_and_roll_back_with_their_receipts
