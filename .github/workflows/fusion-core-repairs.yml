name: Fusion core repair checks

on:
  pull_request:
    branches: [develop/V1.0.0]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: fusion-core-repairs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event.pull_request.draft == false
    name: Linux Core repair regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      ROVAI_HOST_BIN: ${{ github.workspace }}/target/debug/rovai-host
      ROVAI_WEB_UI: ${{ github.workspace }}/out/web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Check Host update fixtures before the long workspace regression
        run: cargo test --locked -p rovai-host --lib

      - name: Run locked workspace tests
        run: cargo test --locked --workspace

      - name: Build workspace binaries
        run: cargo build --locked --workspace --bins

      - name: Build web UI
        run: pnpm build:web

      - name: Run isolated real Host repair regression
        shell: bash
        env:
          HOME: ${{ runner.temp }}/fusion-core-repair-home
          WORKBENCH_EVIDENCE_ROOT: ${{ runner.temp }}/fusion-core-repair-evidence
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME" "$WORKBENCH_EVIDENCE_ROOT"
          node tools/integration/smoke-review-repairs.mjs 2>&1 | tee "$RUNNER_TEMP/fusion-core-repair-smoke.log"

      - name: Preserve smoke log and JSON evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fusion-core-repair-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fusion-core-repair-smoke.log
            ${{ runner.temp }}/fusion-core-repair-evidence/review-repairs-*/evidence/*.json
          if-no-files-found: warn
          retention-days: 1
