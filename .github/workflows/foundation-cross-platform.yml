name: Foundation cross-platform

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to validate
        type: choice
        default: android
        options: [all, macos, ios, android]
      upload_packages:
        description: Upload rebuildable preview packages (off saves artifact storage)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foundation-platform-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
      ios: ${{ steps.scope.outputs.ios }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - id: scope
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import os
          targets={'macos','ios','android'}
          requested=os.environ['REQUESTED_TARGET']
          assert requested in targets | {'all'}, 'Unknown platform'
          selected=targets if requested=='all' else {requested}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for name in sorted(targets):output.write(f'{name}={str(name in selected).lower()}\n')
          print('Selected platforms: '+','.join(sorted(selected)))
          PY
  macos:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    name: ${{ matrix.app }} macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.app == 'coaxi' && matrix.arch == 'x64' && 120 || 90 }}
    concurrency:
      group: foundation-macos-${{ github.ref }}-${{ matrix.app }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: coaxi
            arch: arm64
            runner: macos-26
            pnpm: 11.20.0
          - app: coaxi
            arch: x64
            runner: macos-26-intel
            pnpm: 11.20.0
          - app: coaxi
            arch: arm64
            runner: macos-26
            pnpm: 11.9.0
          - app: coaxi
            arch: x64
            runner: macos-26-intel
            pnpm: 11.9.0
    env:
      FOUNDATION_APP: ${{ matrix.app }}
      FOUNDATION_ARCH: ${{ matrix.arch }}
      CARGO_BUILD_JOBS: 2
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: echo "FOUNDATION_CI_EVIDENCE=$RUNNER_TEMP/foundation-evidence/$FOUNDATION_APP-macos-$FOUNDATION_ARCH" >> "$GITHUB_ENV"
      - name: Extract locked Coaxi source
        if: matrix.app == 'coaxi'
        run: python3 tools/integration/fetch-locked-source.py coaxi "$RUNNER_TEMP/coaxi-macos"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: matrix.app == 'coaxi'
        with:
          version: 11.20.0
          run_install: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: matrix.app == 'coaxi'
        with:
          version: 11.9.0
          package_json_file: ${{ runner.temp }}/coaxi-macos/package.json
          run_install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build native app and available fixtures
        run: bash tools/integration/ci-macos.sh
      - name: Preserve evidence and preview app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-${{ matrix.app }}-macos-${{ matrix.arch }}
          path: |
            ${{ env.FOUNDATION_CI_EVIDENCE }}
            !${{ env.FOUNDATION_CI_EVIDENCE }}/*.zip
            !${{ env.FOUNDATION_CI_EVIDENCE }}/*.apk
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve requested preview package
        if: always() && inputs.upload_packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-${{ matrix.app }}-macos-${{ matrix.arch }}-package
          path: ${{ env.FOUNDATION_CI_EVIDENCE }}/*.zip
          if-no-files-found: warn
          retention-days: 1

  ios:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    name: Coaxi iOS simulator
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: foundation-ios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: echo "FOUNDATION_CI_EVIDENCE=$RUNNER_TEMP/foundation-evidence/coaxi-ios" >> "$GITHUB_ENV"
      - name: Extract locked iOS source
        run: python3 tools/integration/fetch-locked-source.py coaxi-ios "$RUNNER_TEMP/coaxi-ios"
      - name: Compile and launch simulator app
        run: bash tools/integration/ci-ios.sh
      - name: Preserve build and simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-coaxi-ios-simulator
          path: |
            ${{ env.FOUNDATION_CI_EVIDENCE }}
            !${{ env.FOUNDATION_CI_EVIDENCE }}/*.zip
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve requested simulator package
        if: always() && inputs.upload_packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-coaxi-ios-simulator-package
          path: ${{ env.FOUNDATION_CI_EVIDENCE }}/*.zip
          if-no-files-found: warn
          retention-days: 1

  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    name: Coaxi Android build tests emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: foundation-android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: echo "FOUNDATION_CI_EVIDENCE=$RUNNER_TEMP/foundation-evidence/coaxi-android" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Extract locked Android source
        run: python3 tools/integration/fetch-locked-source.py coaxi-android "$RUNNER_TEMP/coaxi-android"
      - name: Compile run source unit tests and launch emulator
        run: bash tools/integration/ci-android.sh
      - name: Preserve APK test reports and emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-coaxi-android
          path: |
            ${{ env.FOUNDATION_CI_EVIDENCE }}
            !${{ env.FOUNDATION_CI_EVIDENCE }}/*.apk
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve requested APK
        if: always() && inputs.upload_packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-coaxi-android-package
          path: ${{ env.FOUNDATION_CI_EVIDENCE }}/*.apk
          if-no-files-found: warn
          retention-days: 1
