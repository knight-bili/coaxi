version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: 依赖更新
      include: scope
