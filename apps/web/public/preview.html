<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>HTML 预览</title></head><body><script>
// Trusted HTML uses the actual Web origin and native browser storage.
// CSP and the parent iframe grant the same preview capabilities.
// Only its actual parent may supply the bytes it read through the authenticated API.
(() => {
  if (location.hash.startsWith('#coaxi.')) {
    // Opaque bootstrap for Coaxi cards. The inner document keeps the source
    // sandbox and CSP, including an empty sandbox when scripts are disabled.
    const id = location.hash.slice(7), hostOrigin = new URL(location.href).origin;
    if (parent === window || !/^[a-f0-9-]{36}$/.test(id)) return;
    let frame = null;
    const ready = () => parent.postMessage({ protocol: 'coaxi-preview-v1', id, type: 'ready' }, hostOrigin);
    addEventListener('message', event => {
      const data = event.data;
      if (frame && event.source === frame.contentWindow) {
        if (data && data.type === 'coaxi-visualize:size' && typeof data.height === 'number' && Number.isFinite(data.height))
          parent.postMessage({ type: 'coaxi-visualize:size', height: data.height }, hostOrigin);
        return;
      }
      if (event.source !== parent || event.origin !== hostOrigin || !data || typeof data !== 'object'
        || data.protocol !== 'coaxi-preview-v1' || data.id !== id || frame) return;
      if (data.type === 'connect') { ready(); return; }
      if (data.type !== 'initialize' || typeof data.html !== 'string' || data.html.length > 96 * 1024 * 1024 || typeof data.scripts !== 'boolean') return;
      document.documentElement.style.cssText = 'height:100%;background:transparent';
      document.body.style.cssText = 'height:100%;margin:0;overflow:hidden;background:transparent';
      frame = document.createElement('iframe');
      frame.title = 'HTML'; frame.referrerPolicy = 'no-referrer';
      frame.setAttribute('sandbox', data.scripts ? 'allow-scripts' : '');
      frame.style.cssText = 'display:block;width:100%;height:100%;border:0;background:transparent';
      frame.srcdoc = data.html; document.body.replaceChildren(frame);
    });
    ready(); return;
  }
  const [previewId, generation] = location.hash.slice(1).split('.');
  const hostOrigin = new URL(location.href).origin;
  if (parent === window || !previewId || !generation) return;
  const ready = () => parent.postMessage({ protocol: 'coaxi-html-preview-v1', type: 'bootstrap-ready', previewId, generation, documentId: 'bootstrap' }, hostOrigin);
  const receive = event => {
    const data = event.data;
    if (event.source !== parent || event.origin !== hostOrigin || !data || typeof data !== 'object'
      || data.protocol !== 'coaxi-html-preview-v1' || data.previewId !== previewId || data.generation !== generation) return;
    if (data.type === 'connect') { ready(); return; }
    if (data.type !== 'initialize' || typeof data.html !== 'string' || data.html.length > 24 * 1024 * 1024) return;
    removeEventListener('message', receive);
    document.open(); document.write(data.html); document.close();
  };
  addEventListener('message', receive);
  ready();
})();
</script></body></html>
