[package]
name = "rovai-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
extended-tests = []
slow-tests = ["extended-tests"]
legacy-migration-tests = ["slow-tests"]

[dependencies]
aes-gcm = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
rand = "0.8"
tokio-util = { version = "0.7", features = ["rt","io"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
semver = "1"
rovai-computer = { path = "../rovai-computer" }
rovai-channels = { path = "../rovai-channels" }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"
croner = "4.0.0"
comrak = { version = "=0.48.0", default-features = false }
dirs = "6"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png","webp"] }
json5 = "0.4"
percent-encoding = "=2.3.2"
regex = "=1.12.3"
portable-pty = "=0.8.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls","stream"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
toml_edit = "0.25"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
url = "2"
unicode-normalization = "=0.1.25"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rusqlite = { version = "0.40.2", features = ["hooks"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
