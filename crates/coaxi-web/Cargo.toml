[package]
name = "coaxi-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","stream"] }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "multipart"] }
base64 = "0.22"
getrandom = "0.3"
if-addrs = "0.15"
memchr = "2"
coaxi-core = { path = "../coaxi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "net", "sync", "time", "io-util"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
